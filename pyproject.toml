[project]
name = "agent-bench"
version = "1.0.0"
description = "Multi-step agentic benchmark harness with declarative checks and a deterministic offline mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The LLM SDK is optional: the package and full test suite run without it.

llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agent-bench = "agent_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
